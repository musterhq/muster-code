name: Mobile Android APK

# A testing build of the phone app (#326) for sideloading on a real Android phone: `expo prebuild` then
# `./gradlew assembleRelease`, signed with the debug keystore that prebuild's template uses for release builds. It is not a
# store build and is not part of any release pipeline: the artifact is muster-<sha>.apk on this run only.
on:
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/agent-app/src/shared/mobile/**"
      - ".github/workflows/mobile-android-apk.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/mobile

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/mobile/pnpm-lock.yaml

      - name: Android SDK
        # ubuntu-latest ships the Android SDK; point Gradle at it.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (debug-signed)
        working-directory: packages/mobile/android
        # arm64-v8a covers current phones and keeps the build time down.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        id: apk
        env:
          # On a pull request GITHUB_SHA is the temporary merge commit; name the APK after the branch's own head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short="${HEAD_SHA::12}"
          src="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p dist-apk
          cp "$src" "dist-apk/muster-${short}.apk"
          echo "name=muster-${short}.apk" >> "$GITHUB_OUTPUT"
          ls -l dist-apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: packages/mobile/dist-apk/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14
