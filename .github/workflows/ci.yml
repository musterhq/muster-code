name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          # @musterhq/core (built below) declares engines.node >=24.
          node-version: "24"
          cache: pnpm

      # packages/builtin depends on "link:../../../muster/packages/core", i.e. a sibling checkout of
      # github.com/musterhq/muster next to this repo. The npm release of @musterhq/core lags that source and
      # lacks the Codex app-server API builtin imports, so build core from a pinned commit instead.
      # This commit is musterhq/muster main after #97 merged (Codex app-server lifecycle budgets: turnId, dispatchState,
      # requireOwner), which builtin/src/codex.ts uses.
      # Bump MUSTER_REF together with any builtin change that needs newer core APIs.
      - name: Build @musterhq/core (sibling checkout)
        env:
          MUSTER_REF: ed9e8fe729573ffab93393445e1ad41776eca0fa
        run: |
          MUSTER_DIR="$(dirname "$GITHUB_WORKSPACE")/muster"
          git init -q "$MUSTER_DIR"
          git -C "$MUSTER_DIR" fetch -q --depth 1 https://github.com/musterhq/muster "$MUSTER_REF"
          git -C "$MUSTER_DIR" checkout -q FETCH_HEAD
          cd "$MUSTER_DIR"
          pnpm install --filter "@musterhq/core..." --filter .
          pnpm exec tsc -p capability-packs/frappe/tsconfig.json
          pnpm --filter @musterhq/core build

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build extension
        run: pnpm build

      - name: Webview script checks
        run: |
          python3 scripts/dev/pane-check.py

      - name: Test
        run: pnpm test
