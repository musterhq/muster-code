name: Muster Agent CI

# packages/agent-app is a standalone npm project (its own package-lock.json); this job uses only that directory.
on:
  push:
    branches: [main, 'release/**']
    paths:
      - "packages/agent-app/**"
      - ".github/workflows/agent-app-ci.yml"
  pull_request:
    paths:
      - "packages/agent-app/**"
      - ".github/workflows/agent-app-ci.yml"
  workflow_dispatch:

concurrency:
  group: agent-app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-app

env:
  NODE_OPTIONS: --max-old-space-size=2048
  # Tests and the build do not load node-pty inside Electron; node-pty's N-API prebuilds cover anything else.
  MUSTER_SKIP_NATIVE_REBUILD: "1"

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/agent-app/.nvmrc
          cache: npm
          cache-dependency-path: packages/agent-app/package-lock.json

      - id: electron
        # Download caches only (never node_modules): keyed on OS, CPU and the locked Electron version.
        shell: bash
        run: echo "version=$(node -p "require(process.env.GITHUB_WORKSPACE + '/packages/agent-app/package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc-rs)
        run: npm run typecheck

      # Parity guard: the official compiler stays the reference while tsc-rs (a 0.x Rust port) earns trust. This runs both
      # checkers on packages/agent-app and packages/server and fails if their sorted diagnostics differ.
      # The official tsc run can be dropped after two weeks of agreement (started with the PR that introduced this step).
      - name: Typecheck parity (tsc vs tsc-rs)
        run: |
          npm run typecheck:tsc
          (cd ../server && npm ci --no-audit --no-fund --ignore-scripts)
          node scripts/typecheck-parity.mjs

      # Some runtime tests load the bundled core from dist/, so build before testing.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Renderer tests
        run: npm run test:renderer
