name: Mobile app CI

# packages/mobile is a standalone pnpm project (its own pnpm-lock.yaml, outside the IDE workspace). This job type-checks the
# app and runs its unit and component tests in Node (jest-expo). No simulator, Xcode or Gradle build runs here: native and
# store builds (EAS, TestFlight, Play internal testing) are a later phase (docs/mobile/DESIGN.md §7, §10).
on:
  push:
    branches: [main, 'release/**']
    paths:
      - "packages/mobile/**"
      - "packages/agent-app/src/shared/mobile/**"
      - "packages/agent-app/src/runtime/mobile/node-crypto.ts"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/agent-app/src/shared/mobile/**"
      - "packages/agent-app/src/runtime/mobile/node-crypto.ts"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/mobile/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
