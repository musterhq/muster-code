name: Muster Agent Release

# Builds packages/agent-app for Apple silicon and Intel and publishes a GitHub Release.
# Tags: agent-v<version> (e.g. agent-v0.2.0; agent-v0.2.0-beta.1 is published as a prerelease).
# The IDE's release.yml only reacts to v* tags, so the two products never trigger each other.
#
# Signing, chosen per run from repository secrets (never printed):
#   Developer ID  MUSTER_SIGN_IDENTITY + MUSTER_SIGN_P12_BASE64 + MUSTER_SIGN_P12_PASSWORD
#                 (+ MUSTER_NOTARY_APPLE_ID, MUSTER_NOTARY_TEAM_ID, MUSTER_NOTARY_PASSWORD to notarize)
#   Self-signed   MUSTER_SELF_SIGN_P12_BASE64 + MUSTER_SELF_SIGN_P12_PASSWORD ("Muster Agent Self-Signed")
#   Ad hoc        no secrets
# Stable versions are published as the latest release whatever the signing mode; -beta/-rc versions are prereleases.
on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. agent-v0.2.0). Leave empty for a dry run of the current version."
        required: false
        type: string
      sha:
        description: "Commit to gate and build. Defaults to the tag's commit (or the tip of main when there is no tag)."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Run the gate and every build job, but create no tag and publish nothing"
        required: false
        type: boolean
        default: false
      force_tests:
        description: "Emergency: re-run the full test suites in the build jobs (normally main's CI has already run them)"
        required: false
        type: boolean
        default: false
  # Called by agent-app-auto-release.yml after main is green; that workflow cannot rely on a tag push (a tag created with
  # GITHUB_TOKEN does not trigger other workflows), so the tag is created here, after the gate and the builds, in `publish`.
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
      sha:
        type: string
        required: false
      create_tag:
        description: "Create the tag at sha in the publish job when it does not exist"
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
      force_tests:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-app-release-${{ inputs.tag || inputs.sha || github.ref_name }}-${{ inputs.dry_run == true && 'dry' || 'real' }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  # Release builds do not re-run the test suites: main's CI already ran them on this exact commit. This job proves it
  # through the Actions API and waits for runs that are still going.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
    steps:
      - name: Resolve the release commit and tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PUSH_SHA: ${{ github.sha }}
          IN_TAG: ${{ inputs.tag }}
          IN_SHA: ${{ inputs.sha }}
          CREATE_TAG: ${{ inputs.create_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="" SHA="" EXISTS=false
          if [[ "$EVENT" == push ]]; then TAG="$PUSH_TAG"; else TAG="$IN_TAG"; fi
          if [[ -n "$TAG" ]]; then
            if REF="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
              EXISTS=true
              read -r TYPE OBJ <<< "$REF"
              if [[ "$TYPE" == tag ]]; then OBJ="$(gh api "repos/$REPO/git/tags/$OBJ" --jq .object.sha)"; fi
              TAG_SHA="$OBJ"
              if [[ -n "$IN_SHA" && "$IN_SHA" != "$TAG_SHA" ]]; then
                echo "::error::Tag $TAG points at $TAG_SHA but sha $IN_SHA was requested."; exit 1
              fi
              SHA="$TAG_SHA"
            fi
          fi
          if [[ -z "$SHA" ]]; then SHA="$IN_SHA"; fi
          if [[ -z "$SHA" && "$DRY_RUN" == true ]]; then SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"; fi
          if [[ -z "$SHA" ]]; then echo "::error::No commit to release: tag '$TAG' does not exist and no sha was given."; exit 1; fi
          SHA="$(gh api "repos/$REPO/commits/$SHA" --jq .sha)"
          if [[ -z "$TAG" ]]; then
            if [[ "$DRY_RUN" != true ]]; then echo "::error::A tag is required for a real release."; exit 1; fi
            VERSION="$(gh api "repos/$REPO/contents/packages/agent-app/package.json?ref=$SHA" --jq .content | base64 -d | jq -r .version)"
            TAG="agent-v$VERSION"
            if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then EXISTS=true; fi
          fi
          if [[ "$TAG" != agent-v* ]]; then echo "::error::Tag $TAG must start with agent-v."; exit 1; fi
          if [[ "$EXISTS" != true && "$DRY_RUN" != true && "$CREATE_TAG" != true ]]; then
            echo "::error::Tag $TAG does not exist. Push it, or run the auto-release workflow."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "Release $TAG at $SHA (tag exists: $EXISTS, dry run: ${DRY_RUN:-false})"

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          # Workflow names, exactly as in .github/workflows/*.yml (agent-app-ci.yml, agent-app-cross-platform.yml, ci.yml).
          REQUIRED=("Muster Agent CI" "Muster Agent Windows & Linux" "CI")
          WAIT_SECS=1200      # running checks: wait up to 20 minutes
          MISSING_SECS=180    # a check that does not exist yet may just be queueing; give it 3 minutes
          START=$SECONDS
          while true; do
            RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs')" || { echo "::warning::API call failed, retrying"; sleep 15; continue; }
            FAILED=() PENDING=() MISSING=() OK=()
            for NAME in "${REQUIRED[@]}"; do
              # Newest push/dispatch run of that workflow on this exact commit (pull_request runs do not count).
              LINE="$(jq -r --arg n "$NAME" '[.[] | select(.name == $n and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | last | if . == null then "missing" else "\(.status) \(.conclusion // "-") \(.html_url)" end' <<< "$RUNS")"
              read -r STATUS CONCLUSION URL <<< "$LINE"
              if [[ "$STATUS" == missing ]]; then MISSING+=("$NAME")
              elif [[ "$STATUS" != completed ]]; then PENDING+=("$NAME ($STATUS) $URL")
              elif [[ "$CONCLUSION" == success ]]; then OK+=("$NAME")
              else FAILED+=("$NAME: $CONCLUSION $URL"); fi
            done
            ELAPSED=$((SECONDS - START))
            echo "[$ELAPSED s] ok=${#OK[@]} pending=${#PENDING[@]} missing=${#MISSING[@]} failed=${#FAILED[@]}"
            if (( ${#FAILED[@]} )); then
              for F in "${FAILED[@]}"; do echo "::error::Required check did not succeed on $SHA: $F"; done; exit 1
            fi
            if (( ${#PENDING[@]} == 0 && ${#MISSING[@]} == 0 )); then
              echo "All required checks succeeded on $SHA: ${OK[*]}" ; exit 0
            fi
            if (( ${#MISSING[@]} && ELAPSED >= MISSING_SECS )); then
              for M in "${MISSING[@]}"; do echo "::error::Required check '$M' has not run on $SHA. If its path filter skipped it, start it with workflow_dispatch on main, then re-run this release."; done; exit 1
            fi
            if (( ELAPSED >= WAIT_SECS )); then
              for P in "${PENDING[@]}"; do echo "::error::Required check still running after 20 minutes: $P"; done; exit 1
            fi
            sleep 20
          done

  build:
    name: build (${{ matrix.arch }})
    needs: gate
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    strategy:
      # Keep the other architecture building when one fails so its log is available; publish needs both anyway.
      fail-fast: false
      matrix:
        include:
          # One native build per architecture: Electron, node-pty and the Quick Look addon are compiled for the runner's
          # own CPU, and the updater picks Muster-Agent-<version>-<arch>.zip for the running architecture.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/agent-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Check tag against package.json
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#agent-v}"
          if [[ "$TAG" != agent-v* || ( "$TAG_VERSION" != "$VERSION" && "$TAG_VERSION" != "$VERSION"-* ) ]]; then
            echo "::error::Tag $TAG does not match packages/agent-app/package.json version $VERSION (expected agent-v$VERSION)."
            exit 1
          fi
          [[ "$(uname -m)" == "${{ matrix.arch }}" || ( "$(uname -m)" == "x86_64" && "${{ matrix.arch }}" == "x64" ) ]] || { echo "::error::Runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/agent-app/.nvmrc
          cache: npm
          cache-dependency-path: packages/agent-app/package-lock.json

      - uses: ./.github/actions/electron-cache

      - name: Install
        # postinstall downloads Electron (cached above) and rebuilds node-pty for it (Xcode is on the runner).
        run: npm ci --no-audit --no-fund

      - name: Verify (force_tests only)
        # main's CI ran the full suites on this commit (see the gate job); this is the emergency re-run.
        if: inputs.force_tests == true
        run: |
          npx tsc --noEmit
          npm run build
          npm test
          # Renderer DOM tests are CPU-independent JS and run on arm64; on the much slower Intel runner their fixed
          # render waits time out (see #111). Re-enable here once the harness waits for the DOM instead.
          if [ "${{ matrix.arch }}" != "x64" ]; then npm run test:renderer; fi

      - name: Prepare signing identity
        id: signing
        env:
          DEVID_IDENTITY: ${{ secrets.MUSTER_SIGN_IDENTITY }}
          DEVID_P12: ${{ secrets.MUSTER_SIGN_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.MUSTER_SIGN_P12_PASSWORD }}
          SELF_P12: ${{ secrets.MUSTER_SELF_SIGN_P12_BASE64 }}
          SELF_P12_PASSWORD: ${{ secrets.MUSTER_SELF_SIGN_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MUSTER_NOTARY_APPLE_ID }}
        run: |
          umask 077
          P12="$RUNNER_TEMP/muster-sign.p12" PW="$RUNNER_TEMP/muster-sign.pw"
          if [[ -n "$DEVID_IDENTITY" && -n "$DEVID_P12" ]]; then
            printf '%s' "$DEVID_P12" | base64 --decode > "$P12"
            printf '%s' "$DEVID_P12_PASSWORD" > "$PW"
            echo "MUSTER_SIGN_IDENTITY=$DEVID_IDENTITY" >> "$GITHUB_ENV"
            if [[ -n "$NOTARY_APPLE_ID" ]]; then MODE=developer-id-notarized; else MODE=developer-id; fi
          elif [[ -n "$SELF_P12" ]]; then
            printf '%s' "$SELF_P12" | base64 --decode > "$P12"
            printf '%s' "$SELF_P12_PASSWORD" > "$PW"
            echo "MUSTER_SIGN_IDENTITY=Muster Agent Self-Signed" >> "$GITHUB_ENV"
            MODE=self-signed
          else
            MODE=adhoc
          fi
          if [[ "$MODE" != adhoc ]]; then
            # package-release.mjs imports the PKCS#12 into this throwaway keychain (random password,
            # partition list for codesign, added to the search list for the run) and deletes it afterwards.
            { echo "MUSTER_SIGN_P12=$P12"; echo "MUSTER_SIGN_P12_PASSWORD_FILE=$PW"; echo "MUSTER_SIGN_KEYCHAIN=$RUNNER_TEMP/muster-sign.keychain-db"; } >> "$GITHUB_ENV"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Signing mode: $MODE"

      - name: Package
        env:
          MUSTER_NOTARY_APPLE_ID: ${{ steps.signing.outputs.mode == 'developer-id-notarized' && secrets.MUSTER_NOTARY_APPLE_ID || '' }}
          MUSTER_NOTARY_TEAM_ID: ${{ steps.signing.outputs.mode == 'developer-id-notarized' && secrets.MUSTER_NOTARY_TEAM_ID || '' }}
          MUSTER_NOTARY_PASSWORD: ${{ steps.signing.outputs.mode == 'developer-id-notarized' && secrets.MUSTER_NOTARY_PASSWORD || '' }}
        run: |
          # Channel from the version, not the tag prefix: agent-v0.2.0 is stable, agent-v0.3.0-beta.1 is beta.
          VERSION_FROM_TAG="${TAG#agent-v}"
          if [[ "$VERSION_FROM_TAG" == *-* ]]; then export MUSTER_UPDATE_CHANNEL=beta; else export MUSTER_UPDATE_CHANNEL=stable; fi
          node scripts/package-release.mjs
          echo "${{ steps.signing.outputs.mode }}" > "release-dist/signing-${{ matrix.arch }}.txt"
          ls -lh release-dist

      - name: Package size budget
        run: node scripts/check-package-size.mjs

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/muster-sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/muster-sign.p12" "$RUNNER_TEMP/muster-sign.pw"

      - uses: actions/upload-artifact@v4
        with:
          name: muster-agent-${{ matrix.arch }}
          path: |
            packages/agent-app/release-dist/Muster-Agent-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            packages/agent-app/release-dist/Muster-Agent-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
            packages/agent-app/release-dist/signing-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  build-other:
    name: build (${{ matrix.os }})
    needs: gate
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: --linux
          - os: windows
            runner: windows-latest
            target: --win
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/agent-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/agent-app/.nvmrc
          cache: npm
          cache-dependency-path: packages/agent-app/package-lock.json
      - name: Linux build tools
        if: matrix.os == 'linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 rpm fakeroot
      - uses: ./.github/actions/electron-cache
      - name: Install
        # electron-builder rebuilds node-pty for Electron while packaging (npmRebuild), so the postinstall rebuild is
        # redundant here (it was most of the Windows install time). The Electron binary is still fetched (and cached).
        env:
          MUSTER_SKIP_NATIVE_REBUILD: "1"
        run: npm ci --no-audit --no-fund
      - name: Build
        # The renderer/runtime bundle that electron-builder packages. Typecheck and tests ran in main's CI.
        shell: bash
        run: npm run build
      - name: Typecheck (force_tests only)
        if: inputs.force_tests == true
        shell: bash
        run: npx tsc --noEmit
      - name: Package
        shell: bash
        # The update source is this repository (forks publish and update from their own).
        run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.musterUpdateRepo=${{ github.repository }} -c.extraMetadata.musterUpdateChannel=${{ contains(env.TAG, '-') && 'beta' || 'stable' }}
      - name: Package size budget
        shell: bash
        # Fails if resources/app/node_modules holds anything but node-pty (or ships build intermediates / another platform's
        # prebuilds); prints a size table here and in the job summary.
        run: node scripts/check-package-size.mjs

      - name: Smoke test (Linux, no --no-sandbox flag)
        if: matrix.os == 'linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs
        env:
          SMOKE_EXPECT_UPDATES: '1'

      - name: Smoke test (Linux AppImage, no --no-sandbox flag)
        if: matrix.os == 'linux'
        run: |
          chmod +x release-dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node scripts/smoke-packaged.mjs "$(ls "$PWD"/release-dist/*.AppImage)"
        env:
          SMOKE_EXPECT_UPDATES: '1'
          SMOKE_PORT: '9478'

      - name: Smoke test (Linux .deb installed, sandbox stays ON)
        if: matrix.os == 'linux'
        # The runner restricts user namespaces (AppArmor), so this only passes if the deb's profile attaches to the launcher
        # and the app boots with the sandbox on and no --no-sandbox fallback notice.
        run: |
          sudo apt-get install -y ./release-dist/Muster-Agent-*-linux-amd64.deb
          ls -l /etc/apparmor.d/muster-agent
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          readlink -f /usr/bin/muster-agent
          xvfb-run -a node scripts/smoke-packaged.mjs /usr/bin/muster-agent
        env:
          SMOKE_EXPECT_UPDATES: '1'
          SMOKE_EXPECT_SANDBOX: '1'
          SMOKE_PORT: '9479'

      - name: Verify Linux packages (desktop entry, AppArmor, launcher)
        if: matrix.os == 'linux'
        run: bash scripts/verify-linux-package.sh
      - name: Smoke test (Windows)
        if: matrix.os == 'windows'
        run: node scripts/smoke-packaged.mjs
        env:
          SMOKE_EXPECT_UPDATES: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: muster-agent-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/agent-app/release-dist/*.AppImage
            packages/agent-app/release-dist/*.deb
            packages/agent-app/release-dist/*.tar.gz
            packages/agent-app/release-dist/*-setup.exe
            packages/agent-app/release-dist/*-win-*.zip
            packages/agent-app/release-dist/*.blockmap
            packages/agent-app/release-dist/latest*.yml
            packages/agent-app/release-dist/beta*.yml
            packages/agent-app/release-dist/alpha*.yml

  # Muster Server ships in the same release: one Node bundle (esbuild) plus the Node 24 runtime per platform. The store is
  # node:sqlite (built into Node), so there is no native addon to rebuild; the tarball carries the platform's own `node`.
  server:
    name: server (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    needs: gate
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      MUSTER_SKIP_NATIVE_REBUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/agent-app/.nvmrc
          cache: npm
          cache-dependency-path: |
            packages/agent-app/package-lock.json
            packages/server/package-lock.json
      - name: Check versions
        run: |
          APP="$(node -p "require('./packages/agent-app/package.json').version")"
          SERVER="$(node -p "require('./packages/server/package.json').version")"
          [[ "$APP" == "$SERVER" ]] || { echo "::error::packages/server is $SERVER but the app is $APP; bump both."; exit 1; }
          [[ "${TAG#agent-v}" == "$APP" || "${TAG#agent-v}" == "$APP"-* ]] || { echo "::error::Tag $TAG does not match version $APP."; exit 1; }
      - name: Build the agent runtime and renderer
        working-directory: packages/agent-app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Verify and build the server
        working-directory: packages/server
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
          npm run build
      - name: Package
        working-directory: packages/server
        run: npm run package && ls -lh release-dist
      - name: Smoke test the tarball
        working-directory: packages/server
        run: |
          DIR="$RUNNER_TEMP/smoke" && mkdir -p "$DIR" && tar -xf release-dist/muster-server-*-${{ matrix.platform }}.tar.xz -C "$DIR"
          BIN="$(echo "$DIR"/muster-server-*/bin/muster-server)"
          "$BIN" --version
          echo 'smoke-test-password-1' | "$BIN" init --data-dir "$DIR/data" --username smoke --port 17999 --password-stdin
          "$BIN" doctor --data-dir "$DIR/data"
      - uses: actions/upload-artifact@v4
        with:
          name: muster-server-${{ matrix.platform }}
          path: packages/server/release-dist/muster-server-*.tar.xz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [gate, build, build-other, server]
    # A dry run builds everything above and stops here: no tag, no release.
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          sparse-checkout: |
            packages/agent-app/package.json
            packages/agent-app/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Create the tag (after the gate and the builds passed)
        # Only the automatic release creates tags. A tag made with GITHUB_TOKEN triggers no workflow, which is why this
        # runs inside the same workflow run rather than starting another through the tag.
        if: needs.gate.outputs.tag_exists != 'true' && inputs.create_tag == true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent
          echo "Created tag $TAG at $SHA"

      - uses: actions/download-artifact@v4
        with:
          pattern: muster-agent-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: muster-server-*
          path: out
          merge-multiple: true

      - name: Checksums and release notes
        id: notes
        env:
          PRERELEASE_INPUT: ${{ inputs.prerelease == true && 'true' || 'false' }}
        run: |
          VERSION="$(node -p "require('./packages/agent-app/package.json').version")"
          cd out
          MODES="$(cat signing-*.txt | sort -u | tr '\n' ' ')"
          rm -f signing-*.txt
          # Update metadata for Windows/Linux in-place updates (latest.yml, latest-linux.yml; beta*.yml for prereleases) and
          # the installers' .blockmap files are checksummed like everything else.
          sha256sum Muster-Agent-* muster-server-* $(ls latest*.yml beta*.yml alpha*.yml 2>/dev/null) > SHA256SUMS
          cat SHA256SUMS
          PRERELEASE=false
          # Stable versions publish as the repository's latest release (shown in the sidebar) whatever the signing mode;
          # only -beta/-rc versions or an explicit request are prereleases.
          VERSION_FROM_TAG="${TAG#agent-v}"
          [[ "$PRERELEASE_INPUT" == "true" || "$VERSION_FROM_TAG" == *-* ]] && PRERELEASE=true
          {
            awk -v v="$VERSION" '
              $0 ~ "^## \\[?" v "([^0-9.-]|$)" {on=1; next}
              on && /^## / {exit}
              on {print}
            ' ../packages/agent-app/CHANGELOG.md 2>/dev/null | tee ../changelog-section.md
            echo
            echo "## Download"
            echo
            echo "| Mac | File |"
            echo "| --- | --- |"
            echo "| Apple silicon (M1 and later) | \`Muster-Agent-${VERSION}-arm64.dmg\` (or \`.zip\`) |"
            echo "| Intel | \`Muster-Agent-${VERSION}-x64.dmg\` (or \`.zip\`) |"
            echo
            echo "Open the disk image and drag **Muster Agent** to **Applications**."
            echo
            echo "| Windows | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (x64) | \`Muster-Agent-${VERSION}-win-x64-setup.exe\` (or the portable \`-win-x64.zip\`) |"
            echo
            echo "Run the installer; it installs for your user, no admin needed. It is not code-signed yet, so Windows SmartScreen may warn: choose **More info → Run anyway**."
            echo
            echo "| Linux | File |"
            echo "| --- | --- |"
            echo "| AppImage (any distro, x64) | \`Muster-Agent-${VERSION}-linux-x86_64.AppImage\` |"
            echo "| Debian / Ubuntu | \`Muster-Agent-${VERSION}-linux-amd64.deb\` |"
            echo "| Archive | \`Muster-Agent-${VERSION}-linux-x64.tar.gz\` |"
            echo
            echo "AppImage: \`chmod +x\` the file, then run it. Debian/Ubuntu: \`sudo apt install ./Muster-Agent-${VERSION}-linux-amd64.deb\`."
            echo
            echo "| Muster Server (self-hosted) | File |"
            echo "| --- | --- |"
            echo "| macOS, Apple silicon | \`muster-server-${VERSION}-darwin-arm64.tar.xz\` |"
            echo "| macOS, Intel | \`muster-server-${VERSION}-darwin-x64.tar.xz\` |"
            echo "| Linux x64 | \`muster-server-${VERSION}-linux-x64.tar.xz\` |"
            echo
            echo "Extract it, then \`bin/muster-server init\` and \`bin/muster-server start\`. It includes its own Node runtime. Docker, systemd and TLS setups are in [docs/server.md](https://github.com/${{ github.repository }}/blob/main/docs/server.md)."
            echo
            echo "Windows (installed with the setup.exe), AppImage and Debian/Ubuntu installs update themselves from Settings › Updates, downloading only what changed where they can."
            echo
            echo "Checksums for every file are in \`SHA256SUMS\`."
            if [[ "$MODES" != "developer-id-notarized " ]]; then
              echo
              echo "This build is not notarized by Apple (signing: ${MODES% }). The first time, right-click **Muster Agent** in Applications and choose **Open**, or run:"
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine "/Applications/Muster Agent.app"'
              echo '```'
            fi
            echo
            echo "Muster Agent needs a model provider sign-in; it detects the ones already on your computer on first run."
          } > ../release-notes.md
          # No CHANGELOG section for this version: let GitHub generate notes from merged PRs/commits.
          if grep -q '[^[:space:]]' ../changelog-section.md; then echo "generate=false" >> "$GITHUB_OUTPUT"; else echo "generate=true" >> "$GITHUB_OUTPUT"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          name: Muster Agent ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.notes.outputs.prerelease != 'true' }}
          files: |
            out/Muster-Agent-*.zip
            out/Muster-Agent-*.dmg
            out/Muster-Agent-*.exe
            out/Muster-Agent-*.AppImage
            out/Muster-Agent-*.deb
            out/Muster-Agent-*.tar.gz
            out/muster-server-*.tar.xz
            out/Muster-Agent-*.blockmap
            out/latest*.yml
            out/beta*.yml
            out/alpha*.yml
            out/SHA256SUMS
