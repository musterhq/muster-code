# Windows and Linux packaging (macOS keeps scripts/package-release.mjs: its .app, signing and DMG are tuned there).
#   npx electron-builder --linux   ->  release-dist/Muster-Agent-<version>-<arch>.AppImage, .deb, .tar.gz
#   npx electron-builder --win     ->  release-dist/Muster-Agent-<version>-<arch>-setup.exe, .zip
# Only the built app ships: dist/ (esbuild bundles every dependency except electron and node-pty) and node-pty.
# electron-builder adds every production dependency to app/node_modules on its own, so "!node_modules/**" comes first
# and node-pty is then added back (scripts/check-package-size.mjs fails CI if anything else slips in).
appId: dev.themuster.agent
productName: Muster Agent
executableName: muster-agent
directories:
  output: release-dist
  buildResources: resources
files:
  - dist/**
  - "!dist/tests/**"
  - "!**/*.map"
  - package.json
  - "!node_modules/**"
  - node_modules/node-pty/**
  - "!node_modules/node-pty/{src,deps,scripts,typings,third_party,node-addon-api}/**"
  - "!node_modules/node-pty/**/*.{md,ts,cc,h,gyp,gypi}"
  # Build intermediates (MSVC/gyp/make output) and debug symbols: not needed to load pty.node.
  - "!node_modules/node-pty/build/**/*.{iobj,ipdb,tlog,obj,pdb,lib,exp,o,d,mk}"
  - "!node_modules/node-pty/build/{Makefile,gyp-mac-tool}"
  - "!node_modules/node-pty/build/**/{obj,obj.target,.deps}/**"
  - "!node_modules/node-pty/prebuilds/**/*.pdb"
  # Other platforms' prebuilds are removed per target in scripts/after-pack.cjs (a platform-level `files` would replace this list).
  # node-pty loads build/Release or prebuilds/<platform>-<arch> only; bin/ is node-gyp output nothing requires.
  - "!node_modules/node-pty/bin/**"
# Packed into one app.asar (a handful of files instead of ~10k: faster install, Defender scans and cold start). Files
# something outside Electron opens by path are unpacked to app.asar.unpacked (src/runtime/unpacked-path.ts): node-pty
# (native addon, ConPTY worker, spawn-helper), the Codex launcher scripts, the browser MCP server Codex starts with
# Electron-as-node, native .node addons and the licence text the file manager opens. macOS keeps package-release.mjs.
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - dist/runtime/resources/**
  - dist/main/browser-mcp.cjs
  - dist/main/*.node
  - dist/renderer/THIRD-PARTY-LICENSES.txt
# Chromium/Electron locales: the app UI is English only; Chromium strings fall back to en-US.
electronLanguages: [en-US]
compression: maximum
npmRebuild: true
nodeGypRebuild: false
artifactName: "Muster-Agent-${version}-${os}-${arch}.${ext}"
# In-place updates (src/main/app-updater.ts). CI always packages with --publish never; this only makes electron-builder
# write latest.yml / latest-linux.yml next to the installers, and the setup.exe's .blockmap is what differential
# Windows downloads read (an AppImage carries its block map inside). The release workflow uploads them with SHA256SUMS.
publish:
  provider: github
  owner: musterhq
  repo: muster-code
  releaseType: release
extraMetadata:
  main: dist/main/index.cjs
  # Electron's app_id / WM_CLASS on Linux; the .desktop entry's StartupWMClass is derived from it.
  desktopName: muster-agent.desktop
afterPack: scripts/after-pack.cjs
protocols:
  - name: Muster
    schemes: [muster]
# AppImage type 2 static runtime: runs without libfuse2 (Ubuntu 24.04 ships only fuse3), zstd squashfs.
toolsets:
  appimage: "1.0.3"
# The Linux build is packaged with -c.productName=muster-agent (package:linux and the cross-platform workflow): the deb
# installs to /opt/<productName>, and Chromium's setuid sandbox helper path breaks on a space ("/opt/Muster", exit 127, #343).
linux:
  target: [AppImage, deb, tar.gz]
  category: Development
  # Every hicolor size (16-512), not one 512 px PNG (scripts/make-icon.sh).
  icon: resources/linux/icons
  synopsis: Agentic development client with memory and sandboxing
  maintainer: Muster <hello@themuster.dev>
  # Explicit: an unset value makes the AppImage menu entry launch with --no-sandbox.
  executableArgs: []
  syncDesktopName: true
  desktop:
    entry:
      Name: Muster Agent
      Keywords: agent;ai;coding;terminal;
deb:
  compression: xz
  # libsecret + a Secret Service provider back safeStorage (API keys); xdg-utils opens links; libnotify4 for notifications.
  # The t64 names come first: on Ubuntu 24.04 libasound2 is only a virtual package, and apt may satisfy it with
  # liboss4-salsa-asound2, which lacks ALSA symbols Electron needs (the app then dies at start). 22.04 falls back.
  depends: [libgtk-3-0t64 | libgtk-3-0, libnss3, libxss1, libasound2t64 | libasound2, libgbm1, libsecret-1-0, xdg-utils, libnotify4]
  recommends: [gnome-keyring | kwalletmanager | keepassxc]
win:
  target: [nsis, zip]
  icon: resources/icon.png
nsis:
  # Per user under %LOCALAPPDATA%\Programs, no admin prompt; Start-menu and desktop shortcuts carry the appId as their
  # AppUserModelID (main/index.ts sets the same id so notifications work).
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  # Non-solid archive so a .blockmap delta stays small (the default; explicit because updates depend on it).
  differentialPackage: true
  # Registers muster:// at install, removes it at uninstall.
  include: resources/windows/installer.nsh
  artifactName: "Muster-Agent-${version}-${os}-${arch}-setup.${ext}"
  shortcutName: Muster Agent
